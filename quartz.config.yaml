# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Second Brain
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: brain.dgcnz.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"

plugins:
  # ---------------------------------------------------------------- transformers
  # v4: Plugin.FrontMatter()
  # hidePropertiesView keeps the v4 look (v4's FrontMatter rendered nothing)
  - source: "@quartz-community/note-properties"
    enabled: true
    order: 5
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml

  # v4: Plugin.CreatedModifiedDate({ priority: [...] }) + configuration.defaultDateType
  - source: "@quartz-community/created-modified-date"
    enabled: true
    order: 10
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    order: 20
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    order: 30
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true

  # local port of quartz/plugins/transformers/removeTags.ts
  - source: ./plugins/remove-tags
    enabled: true
    order: 35
    options:
      ignore:
        - paper
        - book
        - dl2

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only

  - source: "@quartz-community/crawl-links"
    enabled: true
    order: 60
    options:
      markdownLinkResolution: shortest

  # local port of quartz/plugins/transformers/authorLinks.ts (runs after crawl-links)
  - source: ./plugins/author-links
    enabled: true
    order: 65
    options:
      markdownLinkResolution: shortest

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    order: 80
    options:
      renderEngine: katex

  - source: "@quartz-community/quartz-fonts"
    enabled: true

  # ---------------------------------------------------------------- filters
  # v4: Plugin.RemoveDrafts()
  - source: "@quartz-community/remove-draft"
    enabled: true

  # NEW in v5: `unlisted: true` frontmatter hides a page from every listing
  # surface (index, RSS, sitemap, graph, explorer, search, backlinks) while
  # keeping its URL live. No-op until you use the frontmatter key.
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    order: 45

  # ---------------------------------------------------------------- emitters
  # enableCaseRedirects (default true) generates redirects from the old
  # capitalised v4 URLs — essential here, every note lives under
  # "000 Zettelkasten/" or "100 Reference notes/".
  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: "@quartz-community/favicon"
    enabled: true

  # v4: Plugin.CustomOgImages() — slowest emitter, disable to speed up builds
  - source: "@quartz-community/og-image"
    enabled: true

  # self-hosted via rsync to the rpi, no GitHub Pages CNAME needed
  - source: "@quartz-community/cname"
    enabled: false

  # ---------------------------------------------------------------- page types
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # no .canvas / .base files in content/ yet — flip on when you add some
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: false
    order: 50

  # ---------------------------------------------------------------- layout: left
  # local port of Component.Image("static/icon.png", ...)
  - source: ./plugins/sidebar-image
    enabled: true
    options:
      src: static/icon.png
      alt: Icon
      class: sidebar-icon
      width: 224
      height: 224
    layout:
      position: left
      priority: 5

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/spacer"
    enabled: true
    order: 25
    options: {}
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  # ---------------------------------------------------------------- layout: right
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50

  # ---------------------------------------------------------------- layout: beforeBody
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  # local port of quartz/components/AuthorInfo.tsx
  - source: ./plugins/author-info
    enabled: true
    layout:
      position: beforeBody
      priority: 15

  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20

  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30

  # ---------------------------------------------------------------- layout: afterBody
  # filter + index-only condition are JS callbacks -> see quartz.ts
  # upstream plugin stays installed but unmounted; the local wrapper below
  # supplies the v4 `filter` callback that quartz.ts overrides cannot deliver
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: ./plugins/home-recent-notes
    enabled: true
    layout:
      position: afterBody
      priority: 10
      condition: index-only

  # NEW in v5: Andy Matuschak-style sliding panes. Disabled - not wanted.
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all

  # ---------------------------------------------------------------- layout: footer
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links: {}
    layout:
      position: footer
      priority: 50

  # ---------------------------------------------------------------- disabled
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    order: 900

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - author-info
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - author-info
      positions:
        right: []
